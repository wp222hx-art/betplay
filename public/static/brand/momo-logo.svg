<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-label="MoMocash剧场">
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8cc0"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
  </defs>
  <g><defs>
    <radialGradient id="mb" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#ffe3ef"/><stop offset=".55" stop-color="#ff9cc6"/><stop offset="1" stop-color="#ff5c9f"/>
    </radialGradient>
    <radialGradient id="mc" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff4b8"/><stop offset=".6" stop-color="#ffd24d"/><stop offset="1" stop-color="#f5a300"/>
    </radialGradient>
  </defs>
  <!-- 兔耳 -->
  <g transform="rotate(-16 44 34)"><rect x="33" y="6" width="22" height="46" rx="11" fill="#ff7fb4"/><rect x="39" y="13" width="10" height="32" rx="5" fill="#ffd3e5"/></g>
  <g transform="rotate(16 84 34)"><rect x="73" y="6" width="22" height="46" rx="11" fill="#ff7fb4"/><rect x="79" y="13" width="10" height="32" rx="5" fill="#ffd3e5"/></g>
  <!-- 身体：软糯团子 -->
  <path d="M64 30c27 0 46 17 46 42 0 24-19 42-46 42S18 96 18 72c0-25 19-42 46-42z" fill="url(#mb)"/>
  <ellipse cx="46" cy="50" rx="13" ry="7" fill="#fff" opacity=".55" transform="rotate(-24 46 50)"/>
  <!-- 眯眯眼 ^ ^ -->
  <path d="M40 70q6-8 12 0M76 70q6-8 12 0" fill="none" stroke="#5b1f3d" stroke-width="5" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="36" cy="82" rx="8" ry="5" fill="#ff3d86" opacity=".42"/><ellipse cx="92" cy="82" rx="8" ry="5" fill="#ff3d86" opacity=".42"/>
  <!-- ω 嘴 -->
  <path d="M56 81q4 6 8 0q4 6 8 0" fill="none" stroke="#5b1f3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 抱着的金币（cash） -->
  <circle cx="64" cy="104" r="17" fill="url(#mc)" stroke="#e39200" stroke-width="3"/>
  <circle cx="64" cy="104" r="11.5" fill="none" stroke="#fff3c4" stroke-width="2" opacity=".8"/>
  <path d="M64 111l-7-6.5a4.2 4.2 0 0 1 7-4.6 4.2 4.2 0 0 1 7 4.6z" fill="#ff4f93"/>
  <!-- 小爪 -->
  <ellipse cx="46" cy="100" rx="7" ry="5.5" fill="#ffb3d2" stroke="#ff7fb4" stroke-width="2"/><ellipse cx="82" cy="100" rx="7" ry="5.5" fill="#ffb3d2" stroke="#ff7fb4" stroke-width="2"/>
  <!-- 闪光 -->
  <path d="M108 20l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffd24d"/><circle cx="20" cy="30" r="3.5" fill="#ffb3d2"/>
  </g>
  <g font-family="'Fredoka','Baloo 2','Nunito','Noto Sans SC',sans-serif" font-weight="700">
    <text x="136" y="78" font-size="58" fill="url(#wm)" stroke="#fff" stroke-width="6" paint-order="stroke" letter-spacing="-1">MoMo<tspan fill="#ffc53d">cash</tspan></text>
    <text x="140" y="112" font-size="26" fill="#ff5c9f" font-family="'ZCOOL KuaiLe','Noto Sans SC',sans-serif" letter-spacing="6">剧场 · 边看边猜剧情</text>
  </g>
</svg>
